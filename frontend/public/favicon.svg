<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>
  <!-- Outer Coin Edge -->
  <circle cx="50" cy="50" r="46" fill="#1e1e20" stroke="url(#coinGrad)" stroke-width="8"/>
  <!-- Inner Coin Ridge -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#coinGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <!-- Stylized Angled J -->
  <g transform="translate(50, 50) rotate(-15) translate(-50, -50)">
    <!-- Vertical Bars mimicking the $ sign -->
    <path d="M45,25 L45,75 M55,25 L55,75" stroke="url(#coinGrad)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M50,15 L50,85" stroke="url(#coinGrad)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <!-- The letter J -->
    <path d="M60,30 L60,60 C60,75 40,75 40,60 L40,55" fill="none" stroke="url(#coinGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40,30 L70,30" fill="none" stroke="url(#coinGrad)" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>